name: CD

# Deploy on green master only. `workflow_run` rather than a plain push trigger
# so a commit that fails typecheck or tests never reaches production — with two
# independent workflows on `push`, CD would race CI and usually win.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Manual redeploy, for rolling back to a known-good commit or re-running a
  # deploy that failed for an infrastructure reason.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to deploy
        required: false
        default: master

concurrency:
  group: cd-production
  # Never cancel a deploy in flight: a half-applied rollout is worse than a
  # queued one.
  cancel-in-progress: false

jobs:
  api:
    name: control plane -> Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A failed CI run still fires workflow_run; only a successful one deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment: production

    permissions:
      contents: read
      # Required for Workload Identity Federation — the whole point of which is
      # that no long-lived service account key exists to leak.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the commit CI actually validated, not whatever master points
          # at by the time this job starts.
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.ref
                || github.event.workflow_run.head_sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        env:
          SERVICE: von-api
          PROJECT: ${{ secrets.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          RUNTIME_SA: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
          FIRESTORE_DATABASE: ${{ vars.VON_FIRESTORE_DATABASE || 'von-control' }}
          PREVIEW_HOST: ${{ vars.VON_PREVIEW_HOST }}
          GITHUB_ORG: ${{ vars.VON_GITHUB_ORG }}
          TEMPLATE_REPO: ${{ vars.VON_TEMPLATE_REPO }}
          GCP_PARENT: ${{ vars.GCP_PARENT }}
          EXPO_ACCOUNT_ID: ${{ vars.EXPO_ACCOUNT_ID }}
          EXPO_ACCOUNT_NAME: ${{ vars.EXPO_ACCOUNT_NAME }}
        run: |
          set -euo pipefail

          # Built in the shell rather than as a folded YAML string: folding turns
          # newlines into spaces, and " VON_PREVIEW_HOST" is not a variable name.
          # `^|^` switches gcloud's delimiter to `|` so values containing commas
          # — VON_POOLS is JSON — survive intact.
          env_vars="^|^"
          env_vars+="VON_FIRESTORE_PROJECT=${PROJECT}"
          env_vars+="|VON_FIRESTORE_DATABASE=${FIRESTORE_DATABASE}"
          env_vars+="|VON_PREVIEW_HOST=${PREVIEW_HOST}"
          env_vars+="|VON_GITHUB_ORG=${GITHUB_ORG}"
          env_vars+="|VON_TEMPLATE_REPO=${TEMPLATE_REPO}"
          env_vars+="|GCP_PARENT=${GCP_PARENT}"
          env_vars+="|GCP_LOCATION=${REGION}"
          env_vars+="|EXPO_ACCOUNT_ID=${EXPO_ACCOUNT_ID}"
          env_vars+="|EXPO_ACCOUNT_NAME=${EXPO_ACCOUNT_NAME}"

          # Credentials stay in Secret Manager and are mounted by name. Passing
          # them through here would put every one of them in this job's command
          # line and in the Cloud Run service description.
          secrets="^|^"
          secrets+="VON_API_KEYS=von-api-keys:latest"
          secrets+="|ANTHROPIC_API_KEY=anthropic-api-key:latest"
          secrets+="|GITHUB_INSTALLATION_TOKEN=github-installation-token:latest"
          secrets+="|EXPO_TOKEN=expo-token:latest"
          secrets+="|GEMINI_API_KEY=gemini-api-key:latest"
          secrets+="|GCP_BILLING_ACCOUNT=gcp-billing-account:latest"
          secrets+="|VON_POOLS=von-pools:latest"
          secrets+="|VON_POOL_WEB_CONFIGS=von-pool-web-configs:latest"

          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT" \
            --region "$REGION" \
            --platform managed \
            --service-account "$RUNTIME_SA" \
            --port 8787 \
            --timeout 3600 \
            --cpu 2 \
            --memory 4Gi \
            --min-instances 1 \
            --max-instances 1 \
            --set-env-vars "$env_vars" \
            --set-secrets "$secrets" \
            --labels "commit=${GITHUB_SHA::12}" \
            --allow-unauthenticated
          # --allow-unauthenticated is deliberate and is *not* an open door:
          # the service gates itself on VON_API_KEYS, and two endpoints have to
          # be publicly reachable — /healthz for probes, and the preview origins,
          # which are loaded by a webview that cannot present a Google identity.
          #
          # --max-instances 1 is a real constraint, not a cost decision. A
          # preview session is a checkout plus a Metro process held in *this*
          # process's memory, so a second instance would answer a publish for a
          # session it does not have. Scaling out means moving preview sessions
          # to their own workers first.

      - name: Verify the deployment is serving
        run: |
          set -euo pipefail
          url=$(gcloud run services describe von-api \
            --project "${{ secrets.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --format 'value(status.url)')
          echo "deployed: $url"

          # /healthz is unauthenticated so a probe needs no secret, and it
          # reports `durable` — a deploy that silently fell back to in-memory
          # persistence is a failed deploy, not a healthy one.
          body=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "$url/healthz")
          echo "$body"
          echo "$body" | grep -q '"durable":true' \
            || { echo "::error::control plane is running without durable storage"; exit 1; }
