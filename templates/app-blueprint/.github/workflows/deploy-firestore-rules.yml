name: Deploy Firestore Rules

# Publishes firestore.rules to Firebase. Fast (no build). Uses the same
# FIREBASE_SERVICE_ACCOUNT secret as the functions deploy.
#
# Templated from the ByteLearning original: branch trigger and FIREBASE_PROJECT
# are per-app.

on:
  workflow_dispatch:
  push:
    branches:
      - "{{DEFAULT_BRANCH}}"
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firestore-rules.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_PROJECT: "{{FIREBASE_PROJECT_ID}}"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: npx --yes firebase-tools deploy --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive
