name: EAS Update (OTA)

# Publishes a JS/asset-only change over the air. Reaches an installed build in
# about a minute — but ONLY a build whose runtimeVersion matches, and only on
# the channel that build was installed from. Both are decided by the platform's
# release classifier (packages/release), which dispatches this workflow.
#
# The reference implementation had no OTA workflow at all, so every change
# required a full rebuild. This is what makes Tier 0 delivery possible.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS Update channel — must match the installed build"
        type: string
        required: true
      message:
        description: "Update message shown in the EAS dashboard"
        type: string
        default: "Update from Von"
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
    paths:
      - "apps/expo/app/**"
      - "apps/expo/src/**"
      - "apps/expo/assets/**"
      - "packages/**"

jobs:
  update:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # Type-check before publishing. An OTA update reaches devices with no
      # review step, so this is the last gate before it is on real phones.
      - run: pnpm turbo type-check

      - name: Publish update
        working-directory: apps/expo
        run: |
          eas update \
            --branch "${{ inputs.channel || '{{CHANNEL}}' }}" \
            --message "${{ inputs.message || github.event.head_commit.message }}" \
            --non-interactive
