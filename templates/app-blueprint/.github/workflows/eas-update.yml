name: EAS Update (OTA)

# Ships JavaScript/asset changes over-the-air to installed builds — no native
# rebuild. Only native-affecting changes (deps, app config) need the APK
# workflow. Requires the EXPO_TOKEN secret; installed builds must have been made
# with expo-updates configured (channel set in eas.json).
#
# Templated from the ByteLearning original: the branch trigger and the default
# channel are per-app, so the platform's release classifier can dispatch this
# against the right channel for the build the user actually installed.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "EAS Update branch (matches the build channel)"
        type: string
        default: "{{CHANNEL}}"
      release_id:
        description: "Von release this run belongs to; reported back on finish"
        type: string
        required: false
      app_id:
        description: "Von app id"
        type: string
        default: "{{APP_ID}}"
  push:
    branches:
      - "{{DEFAULT_BRANCH}}"
    paths:
      - "apps/expo/app/**"
      - "apps/expo/src/**"
      - "apps/expo/assets/**"

jobs:
  update:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      # Added on top of the ByteLearning original. An OTA update reaches
      # installed builds with no review step, and here the diff was written by
      # an agent, so this is the last gate before it is on a real phone.
      - name: Type-check before publishing
        run: pnpm turbo type-check

      - name: Publish OTA update
        id: publish
        working-directory: apps/expo
        run: |
          set -euo pipefail
          # --json gives the update group, which is the only handle on a
          # published bundle — and therefore the only thing a rollback can
          # republish. Without capturing it here, undo is impossible later.
          out=$(eas update \
            --branch "${{ inputs.branch || '{{CHANNEL}}' }}" \
            --message "CI update ${{ github.sha }}" \
            --json --non-interactive)
          echo "$out"
          group=$(echo "$out" | jq -r 'if type == "array" then .[0].group else .group end')
          echo "group=$group" >> "$GITHUB_OUTPUT"

      # Reported whatever happened, including failure: a release stuck at
      # `queued` forever is indistinguishable from one still running, and the
      # control plane would offer a rollback to a bundle that never published.
      - name: Report the outcome to Von
        if: always() && inputs.release_id != ''
        env:
          VON_API_URL: ${{ secrets.VON_API_URL }}
          VON_RELEASE_TOKEN: ${{ secrets.VON_RELEASE_TOKEN }}
          APP_ID: ${{ inputs.app_id || '{{APP_ID}}' }}
          RELEASE_ID: ${{ inputs.release_id }}
          STATUS: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
          GROUP: ${{ steps.publish.outputs.group }}
        run: |
          set -euo pipefail
          [ -n "$VON_API_URL" ] || { echo "VON_API_URL unset; skipping report"; exit 0; }
          curl -fsS -X POST \
            "$VON_API_URL/v1/apps/$APP_ID/releases/$RELEASE_ID/complete" \
            -H "content-type: application/json" \
            -H "x-von-release-token: $VON_RELEASE_TOKEN" \
            -d "{\"status\":\"$STATUS\",\"updateGroup\":\"${GROUP:-}\"}" 
